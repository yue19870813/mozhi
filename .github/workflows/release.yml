name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.2.0 或 0.2.0-beta.1（不含 v）'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test release tools
        run: python -B -m unittest discover -s scripts -p test_release.py -v
      - name: Validate and prepare release commit
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$REF_TYPE" = branch && test "$BRANCH" = "$DEFAULT_BRANCH"
          python scripts/release.py --version "$VERSION" --check
          python scripts/release.py --version "$VERSION"
          cargo metadata --locked --format-version 1 > /dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock package.json package-lock.json apps/desktop-mobile/package.json apps/desktop-mobile/src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare v$VERSION"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            bundle: nsis
          - os: macos-14
            name: macos-arm64
            bundle: app
          - os: macos-15-intel
            name: macos-x64
            bundle: app
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Verify updater signing key is configured (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PRIVATE_KEY)) {
            throw 'GitHub Actions did not provide TAURI_SIGNING_PRIVATE_KEY to the Windows runner.'
          }
          Write-Host 'Updater signing key is available.'
      - name: Verify updater signing key is configured (Intel macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$UPDATER_PRIVATE_KEY" ]]; then
            echo 'GitHub Actions did not provide TAURI_SIGNING_PRIVATE_KEY to the macOS runner.' >&2
            exit 1
          fi
          echo 'Updater signing key is available.'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-python@v5
        if: matrix.name == 'macos-x64'
        with:
          python-version: '3.12'
      - name: Build Intel macOS ONNX Runtime
        if: matrix.name == 'macos-x64'
        run: bash scripts/macos/build-onnx-intel.sh
      - name: Preserve Intel ONNX build failure logs
        if: failure() && matrix.name == 'macos-x64'
        uses: actions/upload-artifact@v4
        with:
          name: onnx-build-logs-macos-x64
          path: |
            ${{ runner.temp }}/mozhi-onnx-intel/build.log
            ${{ runner.temp }}/mozhi-onnx-intel/build/Release/CMakeCache.txt
            ${{ runner.temp }}/mozhi-onnx-intel/build/Release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows installer
        if: matrix.name == 'windows-x64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri -- build --ci --verbose --bundles ${{ matrix.bundle }} -- --locked
      - name: Build Apple Silicon macOS app
        if: matrix.name == 'macos-arm64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri -- build --ci --verbose --bundles app -- --locked
      - name: Build Intel macOS app with bundled ONNX Runtime
        if: matrix.name == 'macos-x64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri -- build --ci --verbose --bundles app --config "$MOZHI_INTEL_TAURI_CONFIG" -- --locked
      - name: Verify Intel runtime packaging
        if: matrix.name == 'macos-x64'
        run: |
          app_path=(target/release/bundle/macos/*.app)
          runtime="${app_path[0]}/Contents/Frameworks/libonnxruntime.dylib"
          test -f "$runtime"
          lipo "$runtime" -verify_arch x86_64
          codesign --verify --strict "$runtime"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path[0]}/Contents/Info.plist")
          otool -L "${app_path[0]}/Contents/MacOS/$executable" | grep '@rpath/libonnxruntime.dylib'
          env -u DYLD_LIBRARY_PATH python3 - "$runtime" <<'PY'
          import ctypes, sys
          runtime = ctypes.CDLL(sys.argv[1])
          runtime.OrtGetApiBase.restype = ctypes.c_void_p
          class ApiBase(ctypes.Structure):
              _fields_ = [('get_api', ctypes.CFUNCTYPE(ctypes.c_void_p, ctypes.c_uint)),
                          ('get_version', ctypes.CFUNCTYPE(ctypes.c_char_p))]
          api = ctypes.cast(runtime.OrtGetApiBase(), ctypes.POINTER(ApiBase)).contents
          assert api.get_api(28), 'Bundled runtime does not support ONNX API 28'
          assert api.get_version().decode().startswith('1.28.'), 'Unexpected runtime version'
          print('Bundled Intel runtime loaded without build-library search paths')
          PY
      - name: Create macOS disk image without Finder automation
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.name }}
        run: bash scripts/macos/build-dmg.sh target/release/bundle/macos/*.app "target/release/bundle/dmg/MoZhi-$VERSION-$PLATFORM.dmg"
      - name: Windows install, reinstall and uninstall smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/smoke-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.nsis.zip.sig
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
      - name: Validate complete matrix and generate checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release.py --version "$VERSION" --collect artifacts --output release-assets
      - name: Create tag, upload to draft, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          tag="v$VERSION"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
          else
            git tag -a "$tag" "$COMMIT" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # Only resume a draft created by a failed publish; never overwrite a public release.
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --verify-tag --draft --title "MoZhi $tag" --prerelease="$prerelease" --generate-notes
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --prerelease="$prerelease"
