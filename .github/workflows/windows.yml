name: Windows MVP validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri -- build --bundles nsis
      - name: Install, reinstall and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows/smoke-install.ps1
      - run: cargo run --release -p mozhi-core --bin p0-probe -- 10000 > p2-windows-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-mvp-unsigned
          path: |
            p2-windows-report.json
            target/release/bundle/nsis/*.exe
